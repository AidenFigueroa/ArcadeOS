set timeout=0
set default=0

# Load GRUB video support.
insmod all_video
insmod gfxterm

# Request an 800x600, 32-bit, 4:3 graphics mode.
set gfxmode=800x600x32

# Keep the graphics mode active after ArcadeOS starts.
set gfxpayload=keep

# Use GRUB's graphical terminal.
terminal_output gfxterm

# ArcadeOS boot entry.
menuentry "ArcadeOS" {
    multiboot /boot/kernel.bin
    boot
}